name: Golpool Android signed release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: golpool-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project files
        run: flutter create --platforms=android --project-name golpool --org ir.golpool .
      - name: Remove autogenerated sample test
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Validate signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.GOLPOOL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GOLPOOL_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.GOLPOOL_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GOLPOOL_KEY_ALIAS }}
        run: |
          for var in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing signing secret: GOLPOOL_${var#KEYSTORE_}"
              exit 1
            fi
          done
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.GOLPOOL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GOLPOOL_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.GOLPOOL_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GOLPOOL_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/golpool-release.jks
          cat > android/key.properties <<EOF
          storeFile=golpool-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle.kts")
          s=p.read_text()
          s='import java.util.Properties\nimport java.io.FileInputStream\n'+s
          s=s.replace('android {', '''val signingProperties = Properties().apply {
              load(FileInputStream(rootProject.file("key.properties")))
          }
          android {
              signingConfigs {
                  create("golpoolRelease") {
                      keyAlias = signingProperties["keyAlias"] as String
                      keyPassword = signingProperties["keyPassword"] as String
                      storeFile = file(signingProperties["storeFile"] as String)
                      storePassword = signingProperties["storePassword"] as String
                  }
              }
          ''',1)
          s=s.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("golpoolRelease")')
          s=s.replace('applicationId = "ir.golpool.golpool"','applicationId = "ir.golpool.finance"')
          s=s.replace('compileOptions {', '''compileOptions {
                  isCoreLibraryDesugaringEnabled = true
          ''',1)
          s += '\n// Required for scheduled notifications\ndependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5") }\n'
          p.write_text(s)
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          xml=manifest.read_text()
          xml=xml.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>')
          xml=xml.replace('</application>', '    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n      <intent-filter>\n        <action android:name="android.intent.action.BOOT_COMPLETED"/>\n        <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n      </intent-filter>\n    </receiver>\n</application>')
          manifest.write_text(xml)
          PY
      - name: Build signed release APK
        run: flutter build apk --release --build-number="${{ github.run_number }}"
      - name: Inspect release signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk || apksigner verify --verbose build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: golpool-android-release-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
